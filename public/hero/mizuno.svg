<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 1000" width="660" height="1000">
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset=".35" stop-color="#F8C549"/>
      <stop offset=".7" stop-color="#D7972A"/>
      <stop offset="1" stop-color="#8A540B"/>
    </linearGradient>
    <radialGradient id="brilho" cx="50%" cy="34%" r="62%">
      <stop offset="0" stop-color="#D7972A" stop-opacity=".42"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7972A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F8C549" stop-opacity=".85"/>
      <stop offset="1" stop-color="#D7972A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="660" height="1000" fill="#050505"/>
  <rect width="660" height="1000" fill="url(#brilho)"/>

  <!-- rastro de passada -->
  <g transform="rotate(-3 330 500)" opacity=".5">
    <path d="M-120 620 Q330 500 780 620" fill="none" stroke="url(#chao)" stroke-width="2"/>
    <path d="M-120 660 Q330 545 780 660" fill="none" stroke="url(#chao)" stroke-width="1.2" opacity=".6"/>
    <path d="M-120 700 Q330 590 780 700" fill="none" stroke="url(#chao)" stroke-width="1.2" opacity=".35"/>
  </g>

  <!-- silhueta de corrida -->
  <g fill="#0b0b0b" stroke="url(#ouro)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".92">
    <circle cx="372" cy="300" r="30"/>
    <path d="M362 338 L392 344 L404 430 L376 470 L340 462 Z"/>
    <path d="M404 430 L448 486 L430 556"/>
    <path d="M340 462 L288 520 L300 596"/>
    <path d="M392 352 L462 332 L500 366"/>
    <path d="M366 356 L300 380 L268 340"/>
  </g>
  <!-- o par -->
  <g stroke="url(#ouro)" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M430 556 q34 6 46 26 q6 12 -8 16 l-60 0 q-10 0 -10 -12 l0 -22 z"/>
    <path d="M300 596 q-34 6 -46 26 q-6 12 8 16 l60 0 q10 0 10 -12 l0 -22 z"/>
  </g>

  <text x="330" y="792" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, Arial" font-weight="800"
        font-size="96" letter-spacing="2" fill="url(#ouro)">MIZUNO</text>
  <text x="330" y="838" text-anchor="middle" font-family="Barlow, Arial" font-weight="700"
        font-size="24" letter-spacing="11" fill="#FFFFFF" opacity=".72">RUNNING</text>
  <rect x="266" y="866" width="128" height="2" fill="url(#ouro)"/>
</svg>
